<style>
  :root {
    --navy: #0B1D3A;
    --navy-light: #142d5e;
    --signal-blue: #0066CC;
    --signal-red: #D9232D;
    --white: #FFFFFF;
    --bg-light: #F0F4FA;
    --bg-white: #FFFFFF;
    --text-dark: #1A1A2E;
    --text-muted: #5A6A85;
    --border: #DCE4F0;
    --shadow: 0 4px 24px rgba(11,29,58,0.08);
    --shadow-hover: 0 8px 32px rgba(11,29,58,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --container: 1120px;
    --space: clamp(1.5rem, 4vw, 3rem);
    --space-sm: clamp(1rem, 2.5vw, 1.5rem);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-light);
    color: var(--text-dark);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; transition: color var(--transition); }
  img { max-width: 100%; height: auto; display: block; }
  ul { list-style: none; }
  table { width: 100%; border-collapse: collapse; }

  .container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 var(--space-sm); }

  /* Header / Hero */
  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    padding: clamp(3rem, 8vw, 5rem) 0;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;

    opacity: 0.5;
  }
  .hero-content { position: relative; z-index: 1; text-align: center; max-width: 720px; margin: 0 auto; }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    padding: 0.5rem 1.25rem;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    color: #C8D8F0;
  }
  .hero h1 {
    font-size: clamp(2.25rem, 6vw, 3.5rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }
  .hero .tagline {
    font-size: clamp(1.1rem, 2.5vw, 1.35rem);
    font-weight: 400;
    color: #A8C0E8;
    max-width: 560px;
    margin: 0 auto;
  }

  /* Section Base */
  section { padding: var(--space) 0; }
  .section-header { text-align: center; margin-bottom: clamp(2rem, 5vw, 3rem); }
  .section-header .label {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--signal-blue);
    background: rgba(0,102,204,0.1);
    padding: 0.35rem 1rem;
    border-radius: 100px;
    margin-bottom: 0.75rem;
  }
  .section-header h2 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    color: var(--navy);
    line-height: 1.2;
  }

  /* About */
  #about { background: var(--bg-white); }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space);
    align-items: start;
  }
  @media (min-width: 768px) {
    .about-grid { grid-template-columns: 1.2fr 1fr; }
  }
  .about-text p { margin-bottom: 1rem; color: var(--text-dark); font-size: 1.05rem; line-height: 1.75; }
  .about-text p:last-child { margin-bottom: 0; }
  .about-highlights { display: flex; flex-direction: column; gap: 1rem; }
  .highlight-item {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  }
  .highlight-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--signal-blue); }
  .highlight-icon {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--signal-blue), #004499);
    display: flex; align-items: center; justify-content: center;
    color: var(--white);
    font-size: 1.25rem;
  }
  .highlight-content h3 { font-size: 1rem; font-weight: 600; color: var(--navy); margin-bottom: 0.25rem; }
  .highlight-content p { font-size: 0.9rem; color: var(--text-muted); margin: 0; }

  /* Services */
  #services { background: var(--bg-light); }
  .services-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  @media (min-width: 600px) { .services-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 992px) { .services-grid { grid-template-columns: repeat(3, 1fr); } }
  .service-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    position: relative;
    overflow: hidden;
  }
  .service-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--signal-blue), var(--signal-red));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform var(--transition);
  }
  .service-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }
  .service-card:hover::before { transform: scaleX(1); }
  .service-icon {
    width: 64px; height: 64px;
    margin: 0 auto 1.25rem;
    border-radius: 16px;
    background: var(--bg-light);
    display: flex; align-items: center; justify-content: center;
    color: var(--signal-blue);
    font-size: 1.5rem;
    transition: background var(--transition), color var(--transition);
  }
  .service-card:hover .service-icon { background: var(--signal-blue); color: var(--white); }
  .service-card h3 { font-size: 1.15rem; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem; }
  .service-card p { font-size: 0.9rem; color: var(--text-muted); margin: 0; line-height: 1.6; }

  /* Opening Hours */
  #hours { background: var(--bg-white); }
  .hours-wrapper { max-width: 640px; margin: 0 auto; }
  .hours-table {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--bg-white);
  }
  .hours-table thead {
    background: var(--navy);
    color: var(--white);
  }
  .hours-table th, .hours-table td {
    padding: 1rem 1.5rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .hours-table th { font-weight: 600; font-size: 0.9rem; letter-spacing: 0.02em; }
  .hours-table tbody tr:last-child td { border-bottom: none; }
  .hours-table tbody tr:nth-child(even) { background: var(--bg-light); }
  .hours-table tbody tr:hover { background: rgba(0,102,204,0.04); }
  .hours-table .day { font-weight: 500; color: var(--text-dark); white-space: nowrap; }
  .hours-table .time { color: var(--text-muted); font-size: 0.95rem; }
  .hours-table .closed { color: var(--signal-red); font-weight: 500; }
  .hours-note {
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-align: center;
    padding: 0 0.5rem;
  }

  /* Contact */
  #contact { background: var(--navy); color: var(--white); }
  #contact .section-header h2 { color: var(--white); }
  #contact .section-header .label { background: rgba(255,255,255,0.15); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 600px) { .contact-grid { grid-template-columns: repeat(2, 1fr); } }
  .contact-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
    transition: background var(--transition), border-color var(--transition), transform var(--transition);
  }
  .contact-card:hover { background: rgba(255,255,255,0.08); border-color: var(--signal-blue); transform: translateY(-2px); }
  .contact-icon {
    width: 56px; height: 56px;
    margin: 0 auto 1rem;
    border-radius: 14px;
