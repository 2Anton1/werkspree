  <style>
    :root {
      --rose-50: #fdf2f5;
      --rose-100: #fce7ec;
      --rose-200: #f8cdd6;

      --rose-700: #a02d45;
      --rose-800: #85273b;
      --rose-900: #6f2333;
      --warm-50: #faf8f5;
      --warm-100: #f3efe9;
      --warm-200: #e6ddd3;
      --warm-300: #d4c4b0;
      --warm-400: #bda88a;
      --warm-500: #a68d6d;
      --warm-600: #8f7659;
      --warm-700: #765f49;
      --warm-800: #614e3f;
      --warm-900: #514236;
      --charcoal-50: #f5f5f4;
      --charcoal-100: #e7e5e4;
      --charcoal-200: #d6d3d1;
      --charcoal-300: #a8a29e;
      --charcoal-400: #78716c;
      --charcoal-500: #57534e;
      --charcoal-600: #44403c;
      --charcoal-700: #292524;
      --charcoal-800: #1c1917;
      --charcoal-900: #0c0a09;
      --gold-400: #d4a843;
      --gold-500: #c49630;
      --white: #ffffff;
      --shadow-soft: 0 2px 8px -2px rgba(160, 45, 69, 0.08), 0 4px 16px -4px rgba(160, 45, 69, 0.06);
      --shadow-medium: 0 4px 16px -4px rgba(160, 45, 69, 0.12), 0 8px 32px -8px rgba(160, 45, 69, 0.1);
      --shadow-strong: 0 8px 32px -8px rgba(160, 45, 69, 0.18), 0 16px 48px -16px rgba(160, 45, 69, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --transition-fast: 150ms ease;
      --transition-base: 250ms ease;
      --transition-slow: 400ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: var(--charcoal-700);
      background: var(--warm-50);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4 { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; line-height: 1.25; color: var(--charcoal-800); }

    a { color: inherit; text-decoration: none; transition: color var(--transition-fast); }
    a:hover { color: var(--rose-600); }
    a:focus-visible { outline: 2px solid var(--rose-500); outline-offset: 3px; border-radius: 4px; }

    img { max-width: 100%; height: auto; display: block; }

    .container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--rose-100);
      transition: box-shadow var(--transition-base), background var(--transition-base);
    }
    .site-header.scrolled { box-shadow: var(--shadow-soft); background: rgba(255, 255, 255, 0.98); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
    .logo { display: flex; align-items: center; gap: 10px; font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 500; color: var(--charcoal-800); }
    .logo-mark { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--rose-400), var(--rose-600)); display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 1rem; box-shadow: var(--shadow-soft); }
    .nav { display: none; gap: 32px; list-style: none; }
    .nav a { font-size: 0.9rem; font-weight: 500; color: var(--charcoal-600); padding: 8px 0; position: relative; }
    .nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: linear-gradient(90deg, var(--rose-400), var(--gold-400)); border-radius: 2px; transition: width var(--transition-base); }
    .nav a:hover::after, .nav a:focus::after { width: 100%; }
    .nav a:hover { color: var(--rose-600); }
    .header-cta { display: none; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-md); font-weight: 500; font-size: 0.9rem; line-height: 1; border: none; cursor: pointer; transition: all var(--transition-base); white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, var(--rose-500), var(--rose-600)); color: var(--white); box-shadow: var(--shadow-soft); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--rose-600), var(--rose-700)); box-shadow: var(--shadow-medium); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-outline { background: transparent; color: var(--rose-600); border: 2px solid var(--rose-300); }
    .btn-outline:hover { background: var(--rose-50); border-color: var(--rose-500); color: var(--rose-700); }
    .mobile-menu-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--charcoal-700); transition: background var(--transition-fast); }
    .mobile-menu-btn:hover { background: var(--rose-50); }
    .mobile-menu-btn:focus-visible { outline: 2px solid var(--rose-500); outline-offset: 2px; }
    .mobile-menu-btn svg { width: 24px; height: 24px; stroke-width: 2.5; }

    @media (min-width: 768px) {
      .nav { display: flex; }
      .header-cta { display: flex; }
      .mobile-menu-btn { display: none; }
    }

    /* Mobile Nav Overlay */
    .mobile-nav-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: var(--white);
      transform: translateX(100%);
      transition: transform var(--transition-slow) cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; padding: 80px 24px 32px; gap: 8px; overflow-y: auto;
    }
    .mobile-nav-overlay.open { transform: translateX(0); }
    .mobile-nav-overlay .nav { flex-direction: column; gap: 0; width: 100%; }
    .mobile-nav-overlay .nav a { display: block; padding: 16px 0; font-size: 1.125rem; border-bottom: 1px solid var(--rose-100); }
    .mobile-nav-overlay .nav a:last-child { border-bottom: none; }
    .mobile-nav-overlay .header-cta { margin-top: 16px; width: 100%; }
    .mobile-nav-overlay .btn { width: 100%; padding: 16px 24px; font-size: 1rem; }

    /* Hero */
    .hero {
      position: relative;
      padding: 80px 0 100px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, var(--rose-50) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 100%, var(--warm-100) 0%, transparent 60%),
        var(--white);
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d6546e' fill-opacity='0.03'%3E%3Cpath d='M30 30c0-11.046 8.954-20 20-20s20 8.954 20 20-8.954 20-20 20-20-8.954-20-20zm0 2c9.941 0 18 8.059 18 18s-8.059 18-18 18-18-8.059-18-18 8.059-18 18-18z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }
    .hero-content { position: relative; text-align: center; max-width: 720px; margin: 0 auto; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--white);
      border: 1px solid var(--rose-200);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--rose-700);
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
      animation: fadeUp 0.6s ease forwards;
    }
    .hero-badge svg { width: 14px; height: 14px; stroke: currentColor; }
    .hero h1 { font-size: clamp(2.25rem, 5vw, 3.5rem); letter-spacing: -0.02em; margin-bottom: 16px; color: var(--charcoal-900); animation: fadeUp 0.6s ease 0.1s forwards; opacity: 0; transform: translateY(20px); }
    .hero .tagline { font-size: clamp(1.1rem, 2.5vw, 1.35rem); color: var(--charcoal-500); font-weight: 400; max-width: 560px; margin: 0 auto 32px; line-height: 1.7; animation: fadeUp 0.6s ease 0.2s forwards; opacity: 0; transform: translateY(20px); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; animation: fadeUp 0.6s ease 0.3s forwards; opacity: 0; transform: translateY(20px); }
    .hero-stats { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--rose-100); animation: fadeUp 0.6s ease 0.4s forwards; opacity: 0; transform: translateY(20px); }
    .stat { text-align: center; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 600; color: var(--rose-600); line-height: 1.1; }
    .stat-label { font-size: 0.8rem; color: var(--charcoal-500); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* Section Base */
    .section { padding: 80px 0; }
    .section-header { text-align: center; max-width: 640px; margin: 0 auto 56px;
